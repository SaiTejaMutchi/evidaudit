name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit and integration tests
        run: pytest -v
      - name: Run CLI demo, YAML test, reproduction, and verification
        run: |
          evidaudit demo
          evidaudit test examples/payment_expiry.yaml --json
          evidaudit reproduce
          evidaudit reproduce --json > /tmp/reproduce.json
          evidaudit verify
          python examples/quickstart_auth_masking.py
          python examples/replay_vs_regeneration_demo.py
          python examples/integrations/deepeval_metric.py
          python examples/integrations/pydantic_langchain_example.py
